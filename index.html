<!DOCTYPE html>
<html>
<head>
<title>astagfirullah</title>

<style>

body{
text-align:center;
font-family:Arial;
margin-top:120px;
height:100vh;
overflow:hidden;
}

/* tombol */

button{
padding:15px 30px;
font-size:20px;
border:none;
border-radius:25px;
cursor:pointer;
transition:0.2s;
margin:10px;
font-weight:bold;
}

#yesBtn{
background:#4CAF50;
color:black;
}

#noBtn{
background:#f44336;
color:black;
}

/* efek hover */

button:hover{
transform:scale(1.05);
}

/* popup */

#popup{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
justify-content:center;
align-items:center;
}

.popup-content{
background:white;
padding:30px;
border-radius:20px;
text-align:center;
}

.popup-content img{
width:200px;
}

/* gambar utama */

.main-img{
width:180px;
margin:20px auto;
display:block;
}

</style>
</head>

<body>

<h1>sangat ngefans dengan pemilik akun ini?</h1>

<img class="main-img" src="https://i.pinimg.com/736x/31/b1/b0/31b1b05e548d0a2ad0c4e1bd8c14ddab.jpg">

<button id="yesBtn" onclick="yesAnswer()">YES</button>
<button id="noBtn" onclick="noAnswer()">NO</button>

<div id="popup">

<div class="popup-content">

<h1>ya.. memang saya teramat keren sih</h1>
<h2>terimakasih wahai penggemar, btw panggil saya "yang mulia" 😎</h2>

<img src="https://i.pinimg.com/originals/b1/6a/c5/b16ac50ce6954a9f4ee2728e05fe85c4.gif">

</div>

</div>

<script>

let yesSize = 20;

function noAnswer(){

/* YES makin besar */

yesSize += 5;
document.getElementById("yesBtn").style.fontSize = yesSize + "px";

/* NO mulai kabur */

let noBtn = document.getElementById("noBtn");

noBtn.style.position = "absolute";

let x = Math.random() * (window.innerWidth - 150);
let y = Math.random() * (window.innerHeight - 150);

noBtn.style.left = x + "px";
noBtn.style.top = y + "px";

}

function yesAnswer(){

document.getElementById("popup").style.display = "flex";

}

</script>

</body>
</html>
